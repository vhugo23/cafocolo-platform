spring.application.name=cafocolo-api

# Email notification configuration
# Local development stays safe by default because notifications are disabled unless explicitly enabled.
cafocolo.notifications.enabled=${CAFOCOLO_NOTIFICATIONS_ENABLED:false}
cafocolo.notifications.to=${CAFOCOLO_NOTIFICATIONS_TO:}
cafocolo.notifications.from=${CAFOCOLO_NOTIFICATIONS_FROM:}
cafocolo.resend.api-key=${CAFOCOLO_RESEND_API_KEY:}
# Public frontend URL used when generating customer-facing quote review links.
cafocolo.public-frontend-url=${CAFOCOLO_PUBLIC_FRONTEND_URL:http://localhost:3000}

# Actuator / production health checks
# Expose only health and info publicly, not every actuator endpoint.
management.endpoints.web.exposure.include=health,info

# Enables Kubernetes/Cloud-style health groups:
# /actuator/health/liveness
# /actuator/health/readiness
management.endpoint.health.probes.enabled=true

# Keep health output minimal so public health checks do not expose unnecessary internals.
management.endpoint.health.show-details=never

# Include database health in the overall health status.
management.health.db.enabled=true

# Basic application info
info.app.name=Cafocolo API
info.app.description=Backend API for the Cafocolo operations platform.