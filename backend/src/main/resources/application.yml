spring:
  application:
    name: cafocolo-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cafocolo}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

cafocolo:
  auth:
    admin-email: ${CAFOCOLO_ADMIN_EMAIL:admin@cafocolo.local}
    admin-password: ${CAFOCOLO_ADMIN_PASSWORD:admin123}
    jwt-secret: ${CAFOCOLO_JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-chars}
    cookie-secure: ${CAFOCOLO_COOKIE_SECURE:false}
    cookie-same-site: ${CAFOCOLO_COOKIE_SAME_SITE:Lax}
    frontend-origin: ${CAFOCOLO_FRONTEND_ORIGIN:http://localhost:3000}
