spring:
  application:
    name: cafocolo-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cafocolo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

server:
  port: 8080

cafocolo:
  auth:
    admin-email: ${CAFOCOLO_ADMIN_EMAIL:admin@cafocolo.local}
    admin-password: ${CAFOCOLO_ADMIN_PASSWORD:admin123}
    jwt-secret: ${CAFOCOLO_JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-chars}
    cookie-secure: ${CAFOCOLO_COOKIE_SECURE:false}
    frontend-origin: ${CAFOCOLO_FRONTEND_ORIGIN:http://localhost:3000}

